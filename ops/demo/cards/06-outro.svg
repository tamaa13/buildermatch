<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- transparent background so this overlays the slide -->
  <rect x="0" y="0" width="1920" height="1080" fill="transparent"/>
  <g filter="url(#shadow)">
    <rect x="120" y="820" width="1680" height="200" rx="20" ry="20"
          fill="#0B0F1A" fill-opacity="0.82" stroke="#F72585" stroke-opacity="0.6" stroke-width="2"/>
    <text x="160" y="900" font-family="Inter, Helvetica, Arial, sans-serif"
          font-size="56" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">
      memegard.
    </text>
    <text x="160" y="970" font-family="Inter, Helvetica, Arial, sans-serif"
                 font-size="36" font-weight="500" fill="#F72585" letter-spacing="0.5">
        Upvote on DoraHacks.
      </text>
    <text x="1760" y="870" text-anchor="end"
          font-family="JetBrains Mono, Menlo, monospace" font-size="22" fill="#27E8A7">
      0:50–0:60
    </text>
  </g>
</svg>